<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select the lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3f1;
    --ink: #17302b;
    --card: #ffffff;
    --line: #c9d8d3;
    --accent: #0f6b5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1c19;
      --ink: #e4efec;
      --card: #172823;
      --line: #2b413b;
      --accent: #4fc3ad;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 320px; }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 20px; font-weight: 700; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  a.lesson {
    display: block;
    padding: 10px 16px;
    background: var(--card);
    border: 2px solid var(--line);
    border-left: 6px solid var(--accent);
    border-radius: 10px;
    color: var(--ink);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.lesson:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.lesson:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    a.lesson { transition: none; }
    a.lesson:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Select the lesson</h1>

  <!--
    බටන් නම් වෙනස් කරන්න ඕන නම් "Lesson 1" වගේ වචන විතරක් වෙනස් කරන්න.
    href එකේ ෆයිල් නම් GitHub එකේ ඇති නම්වලටම ගැළපෙන්න ඕනේ ("%20" කියන්නේ හිස්තැන).
  -->
  <nav>
    <a class="lesson" href="lesson%2001.html">Lesson 1</a>
    <a class="lesson" href="lesson%2003.html">Lesson 3</a>
    <a class="lesson" href="lesson%2006.html">Lesson 6</a>
    <a class="lesson" href="lesson%2008.html">Lesson 8</a>
  </nav>
</main>
</body>
</html>
